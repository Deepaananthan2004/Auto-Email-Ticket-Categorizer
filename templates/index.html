<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Auto Email Ticket Categorizer</title>

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <div class="wrapper">

        <div class="card">

            <div class="header">

                <div class="icon">
                    <i class="fa-solid fa-envelope-open-text"></i>
                </div>

                <h1>Auto Email Ticket Categorizer</h1>

                <p>
                    AI-powered Support Ticket Classification
                </p>

            </div>

            <form method="POST">

                <label>
                    Support Ticket
                </label>

                <textarea
                    name="ticket"
                    placeholder="Example:
My payment was deducted twice but my subscription is still inactive."
                    required></textarea>

                <button>

                    <i class="fa-solid fa-robot"></i>

                    Analyze Ticket

                </button>

            </form>

            {% if result %}

            <div class="result">

                <h2>

                    <i class="fa-solid fa-chart-simple"></i>

                    Prediction Result

                </h2>

                <div class="grid">

                    <div class="box">

                        <span>Category</span>

                        <h3>{{ result.category }}</h3>

                    </div>

                    <div class="box">

                        <span>Confidence</span>

                        <h3>{{ result.confidence }}%</h3>

                    </div>

                    <div class="box">

                        <span>Priority</span>

                        <h3>{{ result.priority }}</h3>

                    </div>

                    <div class="box">

                        <span>Status</span>

                        <h3>{{ result.review }}</h3>

                    </div>

                </div>

                <div class="ticket">

                    <strong>Ticket</strong>

                    <p>{{ result.ticket }}</p>

                </div>

            </div>

            {% endif %}

        </div>

    </div>

</body>

</html>
